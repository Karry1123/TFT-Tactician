name: Daily China TFT sync
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tft-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ETL dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Crawl and validate (one Gemini request maximum)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/crawler_and_extractor.py
      - name: Publish only validated JSON
        shell: bash
        run: |
          if git diff --quiet -- public/data/meta_comps.json; then
            echo "No database changes"
            exit 0
          fi
          python scripts/crawler_and_extractor.py --validate-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/meta_comps.json
          git commit -m "data: refresh validated China TFT comps"
          # A concurrent main-branch edit causes a safe push failure. Never force push.
          git push origin HEAD:${{ github.event.repository.default_branch }}
